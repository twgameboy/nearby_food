<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1769e0"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>附近吃什麼？</title><style>
:root{--b:#1769e0;--bg:#f6f7fb;--t:#182230;--m:#667085;--l:#e4e7ec;--g:#16803c}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--t);padding-bottom:75px}header{position:sticky;top:0;z-index:5;background:#fff;padding:13px 15px;border-bottom:1px solid var(--l)}h1{font-size:20px;margin:0}.sub,.muted,#status{font-size:12px;color:var(--m);line-height:1.5}main{max-width:900px;margin:auto;padding:10px}.box,.card{background:#fff;border:1px solid var(--l);border-radius:17px;padding:13px;margin-bottom:10px}.row{display:flex;gap:5px;flex-wrap:wrap;align-items:center}button{font:inherit;border:1px solid #d0d5dd;background:#fff;padding:8px 11px;border-radius:999px}.on,.primary{background:var(--b);color:#fff;border-color:var(--b)}.dark{background:#101828;color:#fff}.label{font-size:13px;font-weight:800;margin:11px 0 5px}.search{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:11px;margin-top:10px}.summary{display:flex;justify-content:space-between;margin:13px 2px 7px;font-weight:800}.card{position:relative}.card h3{margin:0 65px 5px 0;font-size:17px}.dist{position:absolute;right:13px;top:13px;background:#eef4ff;color:#1558b0;padding:5px 7px;border-radius:9px;font-size:12px;font-weight:800}.meta{font-size:13px;color:var(--m);line-height:1.55}.open{color:var(--g);font-weight:700}.tags span{display:inline-block;background:#f2f4f7;padding:4px 7px;border-radius:999px;font-size:11px;margin:5px 3px 0 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.actions a,.actions button{text-align:center;text-decoration:none;border:0;border-radius:9px;padding:9px;background:#f2f4f7;color:#344054;font-size:12px;font-weight:700}.actions .map{background:var(--g);color:#fff}.fav.onfav{background:#fff1f3;color:#c01048}.winner{border:2px solid var(--b)}.empty{text-align:center;padding:35px;color:var(--m)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--l);display:flex;justify-content:center;z-index:10;padding-bottom:env(safe-area-inset-bottom)}nav button{border:0;border-radius:0;width:33.33%;max-width:300px;padding:10px 3px;background:#fff;color:var(--m);font-size:12px}nav button.active{color:var(--b);font-weight:800}.install{display:none}.install.show{display:inline-block}
</style></head><body><header><h1>🍜 附近吃什麼？</h1><div class="sub">V3.1 Stable · Multi-source Data Fix</div></header><main>
<section id="home"><div class="box"><div class="row"><button class="primary" id="go">📍 定位搜尋</button><button id="reload">↻ 更新</button><button class="dark" id="random">🎲 幫我選</button><button class="install" id="install">＋ 安裝</button></div><div id="status">尚未定位。</div></div>
<div class="box"><div class="label">📏 距離</div><div id="ranges" class="row"><button data-v="300">300m</button><button data-v="500">500m</button><button class="on" data-v="1000">1km</button></div><div class="label">🏪 類型</div><div id="types" class="row"><button class="on" data-v="all">全部</button><button data-v="food">🍚 餐廳/小吃</button><button data-v="drink">🥤 飲料/咖啡</button></div><div class="label">💰 金額</div><div id="prices" class="row"><button class="on" data-v="all">全部</button><button data-v="low">≤500</button><button data-v="mid">500–1000</button><button data-v="high">≥1000</button></div><div class="label">🕐 餐期（可複選）</div><div id="meals" class="row"><button data-v="breakfast">早餐</button><button data-v="lunch">午餐</button><button data-v="dinner">晚餐</button><button data-v="snack">點心</button><button data-v="other">其他</button></div><div class="label">🚪 狀態</div><div id="opens" class="row"><button class="on" data-v="all">全部</button><button data-v="open">現在營業</button></div><input class="search" id="keyword" placeholder="🔎 搜尋店名 / 料理"></div>
<div class="summary"><span id="count">等待搜尋…</span><span class="muted" id="source">ENGINE READY</span></div><div id="out"><div class="empty">按「定位搜尋」開始。</div></div></section>
<section id="favorites" style="display:none"><div class="summary">❤️ 我的收藏</div><div id="favout"></div></section>
<section id="about" style="display:none"><div class="box"><h3>關於 V3.0</h3><p class="muted">店家來源為 OpenStreetMap / Overpass 公共資料。價格是依店家類型推估，不代表實際客單價。營業中只在 opening_hours 可解析時判定。收藏資料保存在本機。</p></div></section></main>
<nav><button class="active" data-page="home">🏠<br>附近</button><button data-page="favorites">❤️<br>收藏</button><button data-page="about">ℹ️<br>關於</button></nav><script>
let lat,lon,shops=[],tf='all',pf='all',rf=1000,of='all',mf=new Set(),kw='',installPrompt=null;
const E=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter'],S=s=>document.querySelector(s);
function D(a,b,c,d){let R=6371000,p=x=>x*Math.PI/180,x=p(c-a),y=p(d-b),q=Math.sin(x/2)**2+Math.cos(p(a))*Math.cos(p(c))*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function O(h){if(!h)return null;if(h.trim()==='24/7')return true;let ds=['Su','Mo','Tu','We','Th','Fr','Sa'],n=new Date(),day=ds[n.getDay()],mi=n.getHours()*60+n.getMinutes();try{for(let p of h.split(';')){let m=p.trim().match(/(?:(Mo|Tu|We|Th|Fr|Sa|Su)(?:-(Mo|Tu|We|Th|Fr|Sa|Su))?\s+)?(\d\d?):(\d\d)-(\d\d?):(\d\d)/);if(!m)continue;let ok=!m[1]||m[1]===day;if(m[2]){let a=ds.indexOf(m[1]),b=ds.indexOf(m[2]),x=ds.indexOf(day);ok=a<=b?x>=a&&x<=b:x>=a||x<=b}let st=+m[3]*60+ +m[4],en=+m[5]*60+ +m[6];if(ok&&(en>=st?mi>=st&&mi<=en:mi>=st||mi<=en))return true}return false}catch{return null}}
function N(e){let a=e.lat??e.center?.lat,b=e.lon??e.center?.lon;if(a==null)return null,t=e.tags||{},s=((t.name||'')+' '+(t.cuisine||'')+' '+(t.amenity||'')+' '+(t.shop||'')).toLowerCase(),type=/cafe|ice_cream|beverages|tea|coffee|飲料|咖啡|茶/.test(s)?'drink':'food',price=/omakase|懷石|無菜單|fine.?dining/.test(s)?'high':/steak|燒肉|hot_pot|火鍋|buffet|鐵板燒/.test(s)?'mid':'low',me=[];/breakfast|brunch|早餐|早午餐|豆漿|蛋餅/.test(s)&&me.push('breakfast');/restaurant|fast_food|cafe|便當|麵|飯|餐/.test(s)&&me.push('lunch');/restaurant|fast_food|燒肉|火鍋|居酒屋|餐/.test(s)&&me.push('dinner');/cafe|ice_cream|beverages|tea|coffee|甜點|飲料|咖啡|茶|冰|bakery/.test(s)&&me.push('snack');if(!me.length)me.push('other');return{name:t.name||'未命名店家',lat:a,lon:b,t,type,price,meals:[...new Set(me)],dist:D(lat,lon,a,b),open:O(t.opening_hours)}}
function favs(){return JSON.parse(localStorage.getItem('nf3favs')||'[]')}function isfav(x){return favs().some(f=>f.name===x.name&&Math.abs(f.lat-x.lat)<.0001)}function toggle(x){let f=favs(),i=f.findIndex(y=>y.name===x.name&&Math.abs(y.lat-x.lat)<.0001);i>=0?f.splice(i,1):f.push(x);localStorage.setItem('nf3favs',JSON.stringify(f));render();renderFav()}
function list(){return shops.filter(x=>x.dist<=rf&&(tf==='all'||x.type===tf)&&(pf==='all'||x.price===pf)&&(of==='all'||x.open===true)&&(!mf.size||[...mf].some(m=>x.meals.includes(m)))&&(!kw||(x.name+' '+(x.t.cuisine||'')).toLowerCase().includes(kw))).sort((a,b)=>a.dist-b.dist)}
const ML={breakfast:'早餐',lunch:'午餐',dinner:'晚餐',snack:'點心',other:'其他'};
function C(x,w=false){let p=x.price==='low'?'≤500':x.price==='mid'?'500–1000':'≥1000',o=x.open===true?'<span class="open">● 現在營業</span>':x.open===false?'● 目前未判定營業':'● 營業未知',q=encodeURIComponent(x.name),id=encodeURIComponent(x.name+'|'+x.lat);window._cards=window._cards||{};window._cards[id]=x;return `<article class="card ${w?'winner':''}"><span class="dist">${Math.round(x.dist||0)}m</span><h3>${w?'🎲 ':''}${x.name}</h3><div class="meta">${x.type==='drink'?'🥤 飲料/咖啡':'🍚 餐廳/小吃'} · NT$${p}（推估）<br>${o}${x.t.opening_hours?'<br>🕐 '+x.t.opening_hours:''}</div><div class="tags">${x.meals.map(m=>`<span>${ML[m]}</span>`).join('')}</div><div class="actions"><a class="map" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${x.lat},${x.lon}">📍 Maps</a><a target="_blank" href="https://www.google.com/search?q=${q+'%20菜單%20價格'}">💰 菜單</a><a target="_blank" href="https://www.google.com/search?q=${q+'%20評價'}">⭐ 評價</a><button class="fav ${isfav(x)?'onfav':''}" onclick="toggle(window._cards['${id}'])">${isfav(x)?'♥ 已收藏':'♡ 收藏'}</button></div></article>`}
function render(){let a=list();S('#count').textContent=`找到 ${a.length} 家`;S('#out').innerHTML=a.length?a.map(x=>C(x)).join(''):'<div class="empty">目前沒有符合店家。</div>'}function renderFav(){let f=favs();S('#favout').innerHTML=f.length?f.map(x=>C(x)).join(''):'<div class="empty">尚未收藏店家。</div>'}
async function req(u,q){let c=new AbortController(),t=setTimeout(()=>c.abort(),6500);try{let r=await fetch(u,{method:'POST',body:new URLSearchParams({data:q}),signal:c.signal});if(!r.ok)throw Error(r.status);return await r.json()}finally{clearTimeout(t)}}
async function search(force=false){let key='nf31:'+lat.toFixed(3)+','+lon.toFixed(3);if(!force)try{let c=JSON.parse(localStorage.getItem(key)||'null');if(c&&Date.now()-c.time<9e5){shops=c.shops.map(x=>({...x,open:O(x.t.opening_hours)}));S('#status').textContent='✓ 已載入快取';S('#source').textContent='CACHE';render();return}}catch{}let q=`[out:json][timeout:7];(nwr(around:1000,${lat},${lon})["amenity"~"restaurant|cafe|fast_food|food_court|ice_cream"];nwr(around:1000,${lat},${lon})["shop"~"beverages|tea|coffee|bakery"];);out center tags;`;for(let i=0;i<E.length;i++)try{S('#status').textContent=`搜尋節點 ${i+1}/3…`;let z=await req(E[i],q),m=new Map();z.elements.map(N).filter(x=>x&&x.dist<=1000).forEach(x=>m.set(x.name.replace(/\s/g,'')+'|'+x.lat.toFixed(4)+'|'+x.lon.toFixed(4),x));shops=[...m.values()];localStorage.setItem(key,JSON.stringify({time:Date.now(),shops}));localStorage.setItem('nf31lastgood',JSON.stringify({time:Date.now(),lat,lon,shops}));S('#status').textContent=`✓ 已取得 ${shops.length} 家店家`;S('#source').textContent=`NODE ${i+1}`;render();return}catch{}try{let c=JSON.parse(localStorage.getItem('nf31lastgood')||'null');if(c&&c.shops&&c.shops.length){shops=c.shops.map(x=>({...x,dist:D(lat,lon,x.lat,x.lon)})).filter(x=>x.dist<=1000);S('#status').textContent='⚠ 即時來源繁忙，已顯示最近一次成功資料';S('#source').textContent='LAST GOOD';render();return}}catch(e){}S('#status').textContent='即時來源皆未回應，目前也沒有歷史店家資料';S('#source').textContent='OFFLINE'}
function locate(f=false){navigator.geolocation.getCurrentPosition(p=>{lat=p.coords.latitude;lon=p.coords.longitude;search(f)},e=>S('#status').textContent='定位失敗：'+e.message,{enableHighAccuracy:true,timeout:15000,maximumAge:30000})}
S('#go').onclick=()=>locate();S('#reload').onclick=()=>lat?search(true):locate(true);S('#random').onclick=()=>{let a=list();if(!a.length)return alert('目前條件沒有店家');let x=a[Math.floor(Math.random()*a.length)];S('#out').innerHTML=C(x,true)+S('#out').innerHTML;S('#count').scrollIntoView({behavior:'smooth'})};
function one(id,set){document.querySelectorAll(id+' button').forEach(x=>x.onclick=()=>{document.querySelectorAll(id+' button').forEach(y=>y.classList.remove('on'));x.classList.add('on');set(x.dataset.v);render()})}one('#ranges',v=>rf=+v);one('#types',v=>tf=v);one('#prices',v=>pf=v);one('#opens',v=>of=v);document.querySelectorAll('#meals button').forEach(x=>x.onclick=()=>{x.classList.toggle('on');x.classList.contains('on')?mf.add(x.dataset.v):mf.delete(x.dataset.v);render()});S('#keyword').oninput=e=>{kw=e.target.value.trim().toLowerCase();render()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');['home','favorites','about'].forEach(x=>S('#'+x).style.display=x===b.dataset.page?'block':'none');if(b.dataset.page==='favorites')renderFav()});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;S('#install').classList.add('show')});S('#install').onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;S('#install').classList.remove('show')}};renderFav();
</script></body></html>
